name: Release

# A version tag publishes a release. A tag with a suffix, such as v1.2.0-beta.1,
# is a prerelease and only reaches the beta channel.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the application version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test -p daytrace-core

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu sets the minimum glibc, so the Linux
          # packages run on as many distributions as possible.
          - os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - os: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DayTrace ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed in this version.
          releaseDraft: true
          prerelease: ${{ env.PRERELEASE }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  snap:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Debian package from the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p packaging/input
          gh release download "$GITHUB_REF_NAME" --pattern '*_amd64.deb' --dir packaging/input
      - uses: snapcore/action-build@v1
        id: snap
        with:
          path: packaging
      - name: Attach the snap to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.snap.outputs.snap }}"
      - name: Publish to the Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          CHANNEL: ${{ env.PRERELEASE == 'true' && 'beta' || 'stable' }}
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          sudo snap install snapcraft --classic
          snapcraft upload --release="$CHANNEL" "${{ steps.snap.outputs.snap }}"

  publish:
    needs: [build, snap]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      # Beta users follow a fixed address. Every release is copied there, so the
      # beta channel also receives stable versions.
      - name: Update the beta channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json
          gh release view channel-beta >/dev/null 2>&1 || gh release create channel-beta \
            --prerelease --title "Beta update channel" \
            --notes "Update metadata for the DayTrace beta channel. Downloads are on the versioned releases."
          gh release upload channel-beta latest.json --clobber
